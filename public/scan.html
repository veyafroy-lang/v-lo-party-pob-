<script>
(async () => {
  const auth = await fetch("/api/admin/me");

  if (!auth.ok) {
    location.href = "/admin.html";
    return;
  }

  const result = document.querySelector("#result");

  function esc(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function show(cls, title, body) {
    result.className = "result " + cls;
    result.innerHTML = "<h2>" + title + "</h2><p>" + body + "</p>";
  }

  async function scanned(decoded) {
    if (window.busy) return;
    window.busy = true;

    try {
      const response = await fetch(
        "/api/ticket/" + encodeURIComponent(decoded)
      );

      const ticket = await response.json();

      if (ticket.error) {
        show("invalid", "❌ TICKET INVALIDE", esc(ticket.error));
        window.busy = false;
        return;
      }

      const alreadyUsed = !!ticket.checked_in_at;

      show(
        alreadyUsed ? "invalid" : "valid",
        alreadyUsed
          ? "🔴 TICKET DÉJÀ UTILISÉ"
          : "🟢 TICKET VALIDE",
        `${esc(ticket.holder_name)} — ${esc(ticket.ticket_type)} — ${Number(ticket.price).toLocaleString("fr-FR")} FCFA<br>
         Ticket : ${esc(ticket.ticket_number)}
         ${
           alreadyUsed
             ? ""
             : '<br><br><button id="validate" class="btn btn-primary">VALIDER L\'ENTRÉE</button>'
         }`
      );

      const button = document.querySelector("#validate");

      if (button) {
        button.onclick = async () => {
          try {
            const response = await fetch("/api/checkin", {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                token: decoded
              })
            });

            const data = await response.json();

            if (response.ok) {
              show(
                "valid",
                "🟢 ENTRÉE VALIDÉE",
                `${esc(data.ticket.holderName)} — ${esc(data.ticket.ticketType)}<br>${esc(data.ticket.ticketNumber)}`
              );
            } else {
              show(
                "invalid",
                "❌ " + (data.error || "Erreur"),
                ""
              );
            }
          } catch (error) {
            console.error("CHECKIN ERROR:", error);
            show(
              "invalid",
              "❌ Erreur réseau",
              "Impossible de valider le ticket."
            );
          }

          window.busy = false;
        };
      } else {
        window.busy = false;
      }

    } catch (error) {
      console.error("SCAN ERROR:", error);
      show(
        "invalid",
        "❌ Erreur",
        "Impossible de lire le ticket."
      );
      window.busy = false;
    }
  }

  const scanner = new Html5QrcodeScanner(
    "reader",
    {
      fps: 10,
      qrbox: {
        width: 260,
        height: 260
      }
    },
    false
  );

  scanner.render(scanned, () => {});
})();
</script>
